[project]
name = "agent-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nishant-Moolya-MRI", email = "nishant.moolya@mrisoftware.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.16",
    "langchain-azure-ai[hosting]>=1.2.8",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
agent-server = "agent_server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
